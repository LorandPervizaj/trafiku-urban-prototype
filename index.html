<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#17624D" />
    <meta
      name="description"
      content="Find your bus, confirm your stop, and reach the official Prishtina city wallet. Interactive student prototype."
    />
    <title>Trafiku Urban · Prishtina</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/vendor/leaflet.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script defer src="assets/vendor/leaflet.js"></script>
    <script type="module" src="assets/js/main.js"></script>
  </head>
  <body>
    <aside class="desktop-brand">
      <a class="wordmark" href="#map" aria-label="Trafiku — Map home">
        <svg class="brand-route-mark" viewBox="0 0 56 56" role="img" aria-label="Trafiku route mark">
          <rect x="0" y="0" width="56" height="56" rx="16" fill="#292d2c"/>
          <path d="M18 13v24c0 5 4 8 9 8h11V24" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 27h20" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
          <circle cx="18" cy="12.5" r="4.2" fill="#fff"/>
          <circle cx="38" cy="23.5" r="4.2" fill="#fff"/>
        </svg>
        <span class="wordmark-text">trafiku<span class="wordmark-dot">.</span></span>
      </a>
      <p class="desktop-tagline">A simpler way to<br />move through the city.</p>
      <small>RIT KOSOVO · UX PROJECT<br/>Lorand Pervizaj · Donat Bojaj</small>
    </aside>
    <main id="app">
      <section id="map-screen" aria-label="Prishtina bus map">
        <div id="map"></div>
        <div class="filter-panel">
          <div class="filter-top">
            <span class="eyebrow">BUS LINES</span>
            <button class="icon-button" id="settings" aria-label="Open map settings"></button>
          </div>
          <div id="filters" role="group" aria-label="Visible bus lines"></div>
        </div>
        <div class="map-tools">
          <button
            class="icon-button"
            id="stops-toggle"
            aria-label="Toggle stop markers"
          ></button
          ><button
            class="icon-button"
            id="recenter"
            aria-label="Recenter on Prishtina"
          ></button>
        </div>
        <p id="map-warning" class="map-warning" hidden></p>
        <section
          id="stop-sheet"
          class="stop-sheet"
          aria-label="Nearby departures"
        >
          <button
            class="sheet-handle"
            aria-label="Collapse nearby departures"
            aria-expanded="true"
          >
            <span></span>
          </button>
          <div id="sheet-content"><div class="skeleton"></div></div>
        </section>
      </section>
      <section id="page" hidden></section>
      <nav id="navigation" aria-label="Main navigation"></nav>
      <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="connection" role="status" hidden>
        Offline · Local routes remain available. Map tiles need internet.
      </div>
    </main>
  </body>
</html>
