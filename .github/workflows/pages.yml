name: Deploy TRIP to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and Python syntax
        run: |
          for f in assets/js/*.js assets/js/ui/*.js tests/*.js tests/*.mjs; do node --check "$f"; done
          python3 -m py_compile tests/expand-lines.py tests/enrich-stops.py tests/enrich-directions.py tests/enrich-route-fragments.py tests/enrich-private-lines.py tests/normalize-termini.py
      - name: Validate deterministic simulation and dataset
        run: |
          node tests/unit.mjs
          node tests/i18n.mjs
          node tests/route-search.mjs
          node tests/colors.mjs
      - name: Add additional verified OSM segments when available
        run: python3 tests/expand-lines.py
      - name: Import mapped contracted private bus lines
        run: python3 tests/enrich-private-lines.py
      - name: Enrich opposite-direction OSM segments
        run: python3 tests/enrich-directions.py
      - name: Preserve disconnected route context
        run: python3 tests/enrich-route-fragments.py
      - name: Enrich named OSM bus stops
        run: python3 tests/enrich-stops.py
      - name: Use advertised route termini, not clipped segment ends
        run: python3 tests/normalize-termini.py
      - name: Validate enriched line and vehicle data
        run: |
          node tests/unit.mjs
          node tests/route-search.mjs
          node tests/colors.mjs
          node tests/network.mjs
          node tests/stop-arrivals.mjs
      - name: Save verified OSM route snapshot
        shell: bash
        run: |
          if ! git diff --quiet -- data/lines.json data/routes.geojson data/stops.geojson data/route-fragments.geojson; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/lines.json data/routes.geojson data/stops.geojson data/route-fragments.geojson
            git commit -m "data: save verified OSM route segments [skip ci]"
            git push origin HEAD:main || echo "Snapshot not pushed; deployed artifact will still include the routes."
          fi
      - name: Package static assets
        run: python3 tests/package-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
